[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgenswitch"
version = "0.1.0"
description = "Official Python SDK for the NextGenSwitch Programmable Voice API and Voice XML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Infosoftbd Solutions" }]
keywords = ["nextgenswitch", "programmable-voice", "voice-api", "sip", "voip", "pbx", "contact-center"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.0", "ruff>=0.5", "twine>=5.1"]

[project.urls]
Homepage = "https://nextgenswitch.com/"
Documentation = "https://nextgenswitch.com/docs/programmable-voice-api/"
Repository = "https://github.com/nextgenswitch/nextgenswitch-python"
Issues = "https://github.com/nextgenswitch/nextgenswitch-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nextgenswitch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["nextgenswitch"]
